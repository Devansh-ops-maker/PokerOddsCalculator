<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poker Odds Calculator</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Mono:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold:       #c9a84c;
      --gold-light: #e2c46a;
      --gold-dim:   #7a6228;
      --red-card:   #b91c1c;
      --ivory:      #f2ede1;
      --ivory-dim:  #9e9580;
      --felt-top:   #1d4a2c;
      --felt-mid:   #122a1c;
      --felt-deep:  #070f09;
      --card-bg:    #fafaf7;
    }

    html, body { height: 100%; }

    body {
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
      display: flex; align-items: center; justify-content: center;
      padding: 28px 16px;
      background-color: var(--felt-deep);
      background-image: radial-gradient(ellipse 110% 65% at 50% 38%, var(--felt-top) 0%, var(--felt-mid) 48%, var(--felt-deep) 100%);
      background-attachment: fixed;
    }

    body::before {
      content: ''; position: fixed; inset: 0;
      background-image:
        linear-gradient( 45deg, rgba(0,0,0,0.045) 25%, transparent 25%),
        linear-gradient(-45deg, rgba(0,0,0,0.045) 25%, transparent 25%),
        linear-gradient( 45deg, transparent 75%, rgba(0,0,0,0.045) 75%),
        linear-gradient(-45deg, transparent 75%, rgba(0,0,0,0.045) 75%);
      background-size: 4px 4px;
      background-position: 0 0, 0 2px, 2px -2px, -2px 0;
      pointer-events: none; z-index: 0;
    }

    /* ── Table shell ── */
    .table-wrap {
      position: relative; z-index: 1;
      width: 100%; max-width: 660px;
      border-radius: 20px;
      box-shadow:
        0 0 0 2px #b8920e,
        0 0 0 8px #2a1600,
        0 0 0 10px #4a2e08,
        0 28px 80px rgba(0,0,0,0.78),
        0 6px 16px rgba(0,0,0,0.5);
    }

    .table { border-radius: 18px; overflow: hidden; border: 1px solid rgba(201,168,76,0.12); }

    /* ── Header ── */
    .hdr {
      background: linear-gradient(180deg, #110700 0%, #1d0e00 100%);
      border-bottom: 1px solid rgba(184,146,14,0.4);
      padding: 17px 28px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .hdr-title {
      font-family: 'Playfair Display', serif;
      font-size: 19px; font-weight: 700;
      color: var(--gold); letter-spacing: 0.05em;
    }
    .hdr-suits { display: flex; gap: 8px; font-size: 15px; line-height: 1; user-select: none; }
    .hdr-suits .bk { color: rgba(201,168,76,0.45); }
    .hdr-suits .rd { color: rgba(160,40,40,0.55); }

    /* ── Body ── */
    .body {
      background:
        radial-gradient(ellipse 90% 55% at 50% 0%, rgba(30,70,45,0.55) 0%, transparent 65%),
        var(--felt-mid);
      padding: 22px 26px 28px;
      display: flex; flex-direction: column; gap: 18px;
    }

    .lbl {
      font-size: 9px; font-weight: 600;
      letter-spacing: 0.15em; text-transform: uppercase;
      color: var(--gold-dim);
    }

    /* ── Zones ── */
    .zones { display: grid; grid-template-columns: 1fr 1.9fr; gap: 12px; }

    .zone {
      border: 1.5px solid rgba(201,168,76,0.15);
      border-radius: 10px; padding: 10px 11px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
      background: rgba(0,0,0,0.18);
      user-select: none;
    }
    .zone.active {
      border-color: rgba(201,168,76,0.62);
      background: rgba(201,168,76,0.04);
      box-shadow: 0 0 0 2.5px rgba(201,168,76,0.07);
    }
    .zone-top {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 8px;
    }
    .zone-clear {
      background: transparent; border: none;
      color: rgba(255,255,255,0.18); font-size: 9px;
      letter-spacing: 0.1em; text-transform: uppercase;
      cursor: pointer; padding: 0; font-family: inherit;
      transition: color 0.15s;
    }
    .zone-clear:hover { color: rgba(255,255,255,0.5); }

    .zone-cards {
      display: flex; gap: 4px; align-items: center;
      min-height: 48px; flex-wrap: nowrap;
    }

    /* Selected card in zone */
    .z-card {
      flex-shrink: 0;
      width: 31px; height: 43px;
      background: var(--card-bg);
      border-radius: 3px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      cursor: pointer;
      box-shadow: 1px 2px 5px rgba(0,0,0,0.5);
      animation: deal 0.16s ease-out;
      position: relative; overflow: hidden;
      transition: transform 0.1s;
      font-family: 'DM Mono', monospace;
    }
    .z-card:hover { transform: translateY(-2px); }
    .z-card:hover::after {
      content: '×';
      position: absolute; inset: 0;
      background: rgba(0,0,0,0.56);
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 16px; font-weight: 700;
      border-radius: 3px;
    }
    .z-card.red { color: var(--red-card); }
    .z-card.blk { color: #111; }
    .z-card .zr { font-size: 11px; font-weight: 700; line-height: 1; }
    .z-card .zs { font-size: 10px; line-height: 1; }

    @keyframes deal {
      from { transform: translateY(-10px) rotate(-5deg) scale(0.72); opacity: 0; }
      to   { transform: none; opacity: 1; }
    }

    .z-slot {
      flex-shrink: 0; width: 31px; height: 43px;
      border: 1.5px dashed rgba(255,255,255,0.08);
      border-radius: 3px;
    }

    /* ── Players ── */
    .players-row { display: flex; align-items: center; gap: 14px; }
    .stepper {
      display: flex; align-items: center;
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(201,168,76,0.18);
      border-radius: 7px; overflow: hidden;
    }
    .step-btn {
      width: 32px; height: 32px;
      background: transparent; border: none;
      color: var(--gold); font-size: 17px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.13s; line-height: 1;
    }
    .step-btn:hover  { background: rgba(201,168,76,0.08); }
    .step-btn:active { background: rgba(201,168,76,0.15); }
    .step-val {
      width: 34px; text-align: center;
      font-family: 'Playfair Display', serif;
      font-size: 17px; font-weight: 600; color: var(--ivory);
      pointer-events: none; user-select: none;
    }

    /* ── Deck ── */
    .deck-wrap { display: flex; flex-direction: column; gap: 9px; }
    .deck-top { display: flex; align-items: center; justify-content: space-between; }
    .mode-pill {
      font-size: 9px; font-weight: 600;
      letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--gold);
      background: rgba(201,168,76,0.1);
      border: 1px solid rgba(201,168,76,0.22);
      border-radius: 20px; padding: 3px 9px;
      transition: opacity 0.2s;
    }

    .deck {
      display: grid;
      grid-template-columns: repeat(13, 1fr);
      gap: 3px;
    }

    .dk-card {
      aspect-ratio: 5/7;
      background: var(--card-bg);
      border: none; border-radius: 3px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 1px;
      cursor: pointer;
      box-shadow: 1px 1px 3px rgba(0,0,0,0.4);
      transition: transform 0.1s, box-shadow 0.1s, opacity 0.15s;
      padding: 0;
      font-family: 'DM Mono', monospace;
      position: relative; z-index: 1;
    }
    .dk-card.red { color: var(--red-card); }
    .dk-card.blk { color: #111; }

    .dk-card:hover:not(:disabled) {
      transform: translateY(-5px) scale(1.08);
      box-shadow: 2px 6px 12px rgba(0,0,0,0.6);
      z-index: 10;
    }
    .dk-card:active:not(:disabled) { transform: translateY(-2px) scale(1.03); }
    .dk-card:disabled { opacity: 0.17; cursor: not-allowed; }

    .dk-rank { font-size: clamp(7px, 1.8vw, 12px); font-weight: 700; line-height: 1; }
    .dk-suit { font-size: clamp(6px, 1.5vw, 10px); line-height: 1; }

    /* ── Rule ── */
    .rule {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(201,168,76,0.13) 30%, rgba(201,168,76,0.13) 70%, transparent);
    }

    /* ── Calculate button ── */
    .calc {
      position: relative; width: 100%; padding: 13px;
      border: none; border-radius: 9px;
      background: linear-gradient(180deg, #d4ad52 0%, #9a6f20 100%);
      color: #180d00;
      font-family: 'Playfair Display', serif;
      font-size: 15px; font-weight: 700; letter-spacing: 0.07em;
      cursor: pointer; overflow: hidden;
      transition: transform 0.12s, box-shadow 0.12s;
      box-shadow: 0 4px 18px rgba(160,110,30,0.38), inset 0 1px 0 rgba(255,255,255,0.2);
    }
    .calc::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.15) 0%, transparent 55%);
      pointer-events: none;
    }
    .calc:not(:disabled):hover {
      transform: translateY(-1px);
      box-shadow: 0 7px 22px rgba(160,110,30,0.48), inset 0 1px 0 rgba(255,255,255,0.2);
    }
    .calc:not(:disabled):active { transform: translateY(1px); box-shadow: 0 2px 8px rgba(160,110,30,0.28); }
    .calc:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ── Dots ── */
    .dots { display: none; justify-content: center; align-items: center; gap: 6px; height: 14px; }
    .dots.on { display: flex; }
    .dots span {
      display: block; width: 5px; height: 5px;
      border-radius: 50%; background: var(--gold);
      animation: blink 1.1s ease-in-out infinite;
    }
    .dots span:nth-child(2) { animation-delay: 0.18s; }
    .dots span:nth-child(3) { animation-delay: 0.36s; }
    @keyframes blink {
      0%,80%,100% { opacity: 0.2; transform: scale(0.75); }
      40%         { opacity: 1;   transform: scale(1); }
    }

    /* ── Error ── */
    .err {
      display: none; padding: 10px 13px; border-radius: 7px;
      background: rgba(120,20,20,0.18); border: 1px solid rgba(180,50,50,0.28);
      color: #e08080; font-size: 12px; letter-spacing: 0.02em;
    }
    .err.on { display: block; }

    /* ── Result ── */
    .result { display: none; flex-direction: column; gap: 12px; }
    .result.on { display: flex; animation: rise 0.28s ease-out; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .result-row { display: flex; justify-content: space-between; align-items: baseline; }
    .result-pct {
      font-family: 'Playfair Display', serif;
      font-size: 42px; font-weight: 700;
      color: var(--gold-light); line-height: 1;
    }
    .bar-track { height: 5px; background: rgba(0,0,0,0.4); border-radius: 3px; overflow: hidden; }
    .bar-fill {
      height: 100%; border-radius: 3px;
      background: linear-gradient(90deg, var(--gold-dim), var(--gold), var(--gold-light));
      width: 0%; transition: width 0.85s cubic-bezier(0.16,1,0.3,1);
    }
    .result-note { font-size: 12px; color: var(--ivory-dim); }

    /* ── Responsive ── */
    @media (max-width: 460px) {
      .zones { grid-template-columns: 1fr; }
      .body  { padding: 16px 16px 22px; }
      .hdr   { padding: 14px 16px; }
      .deck  { gap: 2px; }
    }
  </style>
</head>
<body>

  <div class="table-wrap">
    <div class="table">

      <div class="hdr">
        <div class="hdr-title">Poker Odds Calculator</div>
        <div class="hdr-suits">
          <span class="bk">♠</span><span class="rd">♥</span>
          <span class="rd">♦</span><span class="bk">♣</span>
        </div>
      </div>

      <div class="body">

        <!-- Selection zones -->
        <div class="zones">
          <div class="zone active" id="zone-hand" onclick="setMode('hand')">
            <div class="zone-top">
              <span class="lbl">Your Hand</span>
              <button class="zone-clear" onclick="event.stopPropagation(); clearZone('hand')">clear</button>
            </div>
            <div class="zone-cards" id="slots-hand"></div>
          </div>
          <div class="zone" id="zone-board" onclick="setMode('board')">
            <div class="zone-top">
              <span class="lbl">Board</span>
              <button class="zone-clear" onclick="event.stopPropagation(); clearZone('board')">clear</button>
            </div>
            <div class="zone-cards" id="slots-board"></div>
          </div>
        </div>

        <!-- Players -->
        <div class="players-row">
          <span class="lbl">Players at table</span>
          <div class="stepper">
            <button class="step-btn" onclick="adj(-1)">−</button>
            <div class="step-val" id="playersVal">2</div>
            <button class="step-btn" onclick="adj(1)">+</button>
          </div>
        </div>

        <!-- Deck -->
        <div class="deck-wrap">
          <div class="deck-top">
            <span class="lbl">Select cards</span>
            <div class="mode-pill" id="modePill">Adding to: Your Hand</div>
          </div>
          <div class="deck" id="deck"></div>
        </div>

        <div class="rule"></div>

        <button class="calc" id="calcBtn" onclick="run()">
          <span id="btnTxt">Calculate Odds</span>
        </button>

        <div class="dots" id="dots"><span></span><span></span><span></span></div>

        <div class="err" id="err" role="alert"></div>

        <div class="result" id="result" aria-live="polite">
          <div class="result-row">
            <span class="lbl">Win Probability</span>
            <span class="result-pct" id="resultPct"></span>
          </div>
          <div class="bar-track"><div class="bar-fill" id="barFill"></div></div>
          <div class="result-note" id="resultNote"></div>
        </div>

      </div>
    </div>
  </div>

  <script>
    const RANKS = ['A','2','3','4','5','6','7','8','9','T','J','Q','K'];
    const SUITS = [
      { sym:'♠', key:'s', cls:'blk' },
      { sym:'♥', key:'h', cls:'red' },
      { sym:'♦', key:'d', cls:'red' },
      { sym:'♣', key:'c', cls:'blk' },
    ];
    const SYMS  = { h:'♥', d:'♦', s:'♠', c:'♣' };
    const RED_S = new Set(['h','d']);

    const state = { hand:[], board:[], mode:'hand' };
    const MAXH = 2, MAXB = 5;

    function buildDeck() {
      const deck = document.getElementById('deck');
      SUITS.forEach(suit => {
        RANKS.forEach(rank => {
          const id  = rank + suit.key;
          const btn = document.createElement('button');
          btn.className    = 'dk-card ' + suit.cls;
          btn.dataset.id   = id;
          btn.innerHTML    = `<span class="dk-rank">${rank}</span><span class="dk-suit">${suit.sym}</span>`;
          btn.addEventListener('click', () => pickCard(id));
          deck.appendChild(btn);
        });
      });
    }

    function pickCard(id) {
      if ([...state.hand, ...state.board].includes(id)) return;
      if (state.mode === 'hand') {
        if (state.hand.length < MAXH) {
          state.hand.push(id);
          if (state.hand.length >= MAXH) state.mode = 'board';
        }
      } else {
        if (state.board.length < MAXB) state.board.push(id);
      }
      render();
    }

    function removeCard(zone, id) {
      state[zone] = state[zone].filter(c => c !== id);
      render();
    }

    function clearZone(zone) { state[zone] = []; render(); }

    function setMode(mode) { state.mode = mode; render(); }

    function render() {
      document.getElementById('modePill').textContent =
        'Adding to: ' + (state.mode === 'hand' ? 'Your Hand' : 'Board');
      document.getElementById('zone-hand') .classList.toggle('active', state.mode === 'hand');
      document.getElementById('zone-board').classList.toggle('active', state.mode === 'board');
      renderZone('hand',  MAXH);
      renderZone('board', MAXB);
      const used = new Set([...state.hand, ...state.board]);
      document.querySelectorAll('.dk-card').forEach(el => {
        el.disabled = used.has(el.dataset.id);
      });
      hide('err');
    }

    function renderZone(zone, max) {
      const el = document.getElementById('slots-' + zone);
      el.innerHTML = '';
      state[zone].forEach(id => el.appendChild(makeZoneCard(id, zone)));
      for (let i = state[zone].length; i < max; i++) {
        const s = document.createElement('div');
        s.className = 'z-slot';
        el.appendChild(s);
      }
    }

    function makeZoneCard(id, zone) {
      const rank = id.slice(0,-1);
      const suit = id.slice(-1);
      const el   = document.createElement('div');
      el.className = 'z-card ' + (RED_S.has(suit) ? 'red' : 'blk');
      el.title     = 'Click to remove';
      el.innerHTML = `<span class="zr">${rank}</span><span class="zs">${SYMS[suit]}</span>`;
      el.addEventListener('click', e => { e.stopPropagation(); removeCard(zone, id); });
      return el;
    }

    let players = 2;
    function adj(d) {
      players = Math.min(9, Math.max(2, players + d));
      document.getElementById('playersVal').textContent = players;
    }

    function show(id) { document.getElementById(id).classList.add('on'); }
    function hide(id) { document.getElementById(id).classList.remove('on'); }

    function setLoading(on) {
      document.getElementById('calcBtn').disabled = on;
      document.getElementById('btnTxt').textContent = on ? 'Calculating…' : 'Calculate Odds';
      document.getElementById('dots').classList.toggle('on', on);
    }

    function getNote(p) {
      if (p >= 0.75) return "Strong favourite — you're well ahead of the field.";
      if (p >= 0.56) return "Slight edge — trust your read and play your position.";
      if (p >= 0.42) return "Roughly even — a flip. Pot odds will decide.";
      if (p >= 0.25) return "You're the underdog. Find your outs and pick your spot.";
      return "Significant underdog. Consider your fold equity carefully.";
    }

    async function run() {
      if (state.hand.length < 2) {
        document.getElementById('err').textContent = 'Select 2 hole cards from the deck below.';
        show('err'); return;
      }
      hide('err'); hide('result');
      setLoading(true);
      try {
         const qs = new URLSearchParams({
  player_cards: state.hand.join(''),
  comm_cards: state.board.join(','),
  total_players: players
});
        const res = await fetch('/probability?' + qs);
        if (!res.ok) {
          const body = await res.json().catch(() => ({}));
          throw new Error(body.detail || `Server returned ${res.status}.`);
        }
        const data = await res.json();
        const pct  = (data.probability * 100).toFixed(1);
        document.getElementById('resultPct').textContent  = pct + '%';
        document.getElementById('resultNote').textContent = getNote(data.probability);
        document.getElementById('barFill').style.width    = '0%';
        show('result');
        setTimeout(() => { document.getElementById('barFill').style.width = pct + '%'; }, 60);
      } catch(e) {
        document.getElementById('err').textContent = e.message || 'Could not reach the server.';
        show('err');
      } finally {
        setLoading(false);
      }
    }

    buildDeck();
    render();
  </script>

</body>
</html>
